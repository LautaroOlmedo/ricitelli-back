syntax = "proto3";

package purchasing_administration;

option go_package = "ricitelli-back/cmd/http/gen/purchasing_administration;purchasingadministrationpb";

// All decimal and NUMERIC values cross the API as non-exponent decimal strings.
message Supplier {
  string id = 1;
  string tax_id = 2;
  string social_reason = 3;
  string trade_name = 4;
  string email = 5;
  string phone = 6;
  string address = 7;
  bool active = 8;
  string idempotency_key = 9;
  string created_at = 10;
  string updated_at = 11;
}

message PurchaseNeedItem {
  string id = 1;
  string purchase_need_id = 2;
  int32 line_number = 3;
  string dry_supply_id = 4;
  string description = 5;
  string quantity = 6;
  string unit = 7;
}

message PurchaseNeed {
  string id = 1;
  int64 need_number = 2;
  string requested_date = 3;
  string required_by_date = 4;
  string status = 5;
  string notes = 6;
  string idempotency_key = 7;
  string created_at = 8;
  string updated_at = 9;
  repeated PurchaseNeedItem items = 10;
}

message SupplierQuoteItem {
  string id = 1;
  string supplier_quote_id = 2;
  string purchase_need_item_id = 3;
  int32 line_number = 4;
  string dry_supply_id = 5;
  string description = 6;
  string quantity = 7;
  string unit = 8;
  string unit_price = 9;
  string tax_rate = 10;
  string net_amount = 11;
  string tax_amount = 12;
  string total_amount = 13;
}

message SupplierQuote {
  string id = 1;
  string supplier_id = 2;
  string purchase_need_id = 3;
  string quote_number = 4;
  string quote_date = 5;
  string valid_until = 6;
  string currency = 7;
  string exchange_rate = 8;
  string subtotal = 9;
  string tax_total = 10;
  string total_amount = 11;
  string status = 12;
  string idempotency_key = 13;
  string created_at = 14;
  string updated_at = 15;
  repeated SupplierQuoteItem items = 16;
}

message SupplierInvoiceItem {
  string id = 1;
  string supplier_invoice_id = 2;
  string supplier_quote_item_id = 3;
  int32 line_number = 4;
  string dry_supply_id = 5;
  string description = 6;
  string quantity = 7;
  string unit = 8;
  string unit_price = 9;
  string tax_rate = 10;
  string net_amount = 11;
  string tax_amount = 12;
  string total_amount = 13;
}

message SupplierInvoice {
  string id = 1;
  string supplier_id = 2;
  string supplier_quote_id = 3;
  string document_type = 4;
  int32 point_of_sale = 5;
  int64 document_number = 6;
  string issue_date = 7;
  string due_date = 8;
  string currency = 9;
  string exchange_rate = 10;
  string subtotal = 11;
  string tax_total = 12;
  string total_amount = 13;
  string status = 14;
  string idempotency_key = 15;
  string created_at = 16;
  string updated_at = 17;
  repeated SupplierInvoiceItem items = 18;
}

message SupplierPaymentAllocation {
  string id = 1;
  string supplier_payment_id = 2;
  string supplier_invoice_id = 3;
  string allocated_amount = 4;
}

message SupplierPayment {
  string id = 1;
  string supplier_id = 2;
  int64 payment_number = 3;
  string payment_date = 4;
  string currency = 5;
  string exchange_rate = 6;
  string amount = 7;
  string payment_method = 8;
  string payment_reference = 9;
  string status = 10;
  string idempotency_key = 11;
  string created_at = 12;
  string updated_at = 13;
  repeated SupplierPaymentAllocation allocations = 14;
}

message SupplierInvoiceBalance {
  string supplier_invoice_id = 1;
  string supplier_id = 2;
  string document_type = 3;
  int32 point_of_sale = 4;
  int64 document_number = 5;
  string issue_date = 6;
  string currency = 7;
  string total_amount = 8;
  string allocated_amount = 9;
  string outstanding_amount = 10;
}

message SupplierOutstandingBalance {
  string supplier_id = 1;
  string currency = 2;
  string total_outstanding = 3;
  repeated SupplierInvoiceBalance invoices = 4;
}

message VATPositionLine {
  string tax_rate = 1;
  string sales_debit = 2;
  string purchase_credit = 3;
  string net_vat = 4;
}

message MonthlyVATPosition {
  string month = 1;
  string sales_debit_total = 2;
  string purchase_credit_total = 3;
  string net_vat = 4;
  repeated VATPositionLine lines = 5;
}

message IDRequest { string id = 1; }
message SupplierListRequest { bool include_inactive = 1; }
message SupplierListResponse { repeated Supplier suppliers = 1; }
message SupplierScopedRequest { string supplier_id = 1; }
message StatusRequest { string id = 1; string status = 2; }
message PurchaseNeedListRequest {}
message PurchaseNeedListResponse { repeated PurchaseNeed purchase_needs = 1; }
message SupplierQuoteListResponse { repeated SupplierQuote supplier_quotes = 1; }
message SupplierInvoiceListResponse { repeated SupplierInvoice supplier_invoices = 1; }
message SupplierPaymentListResponse { repeated SupplierPayment supplier_payments = 1; }
message OutstandingBalanceRequest { string supplier_id = 1; string currency = 2; }
message MonthlyVATPositionRequest { string month = 1; }

message CreateSupplierRequest {
  string tax_id = 1;
  string social_reason = 2;
  string trade_name = 3;
  string email = 4;
  string phone = 5;
  string address = 6;
  string idempotency_key = 7;
}

message UpdateSupplierRequest {
  string id = 1;
  string tax_id = 2;
  string social_reason = 3;
  string trade_name = 4;
  string email = 5;
  string phone = 6;
  string address = 7;
}

message CreatePurchaseNeedRequest {
  int64 need_number = 1;
  string requested_date = 2;
  string required_by_date = 3;
  string notes = 4;
  string idempotency_key = 5;
  repeated PurchaseNeedItem items = 6;
}

message CreateSupplierQuoteRequest {
  string supplier_id = 1;
  string purchase_need_id = 2;
  string quote_number = 3;
  string quote_date = 4;
  string valid_until = 5;
  string currency = 6;
  string exchange_rate = 7;
  string subtotal = 8;
  string tax_total = 9;
  string total_amount = 10;
  string idempotency_key = 11;
  repeated SupplierQuoteItem items = 12;
}

message CreateSupplierInvoiceRequest {
  string supplier_id = 1;
  string supplier_quote_id = 2;
  string document_type = 3;
  int32 point_of_sale = 4;
  int64 document_number = 5;
  string issue_date = 6;
  string due_date = 7;
  string currency = 8;
  string exchange_rate = 9;
  string subtotal = 10;
  string tax_total = 11;
  string total_amount = 12;
  string idempotency_key = 13;
  repeated SupplierInvoiceItem items = 14;
}

message CreateSupplierPaymentRequest {
  string supplier_id = 1;
  int64 payment_number = 2;
  string payment_date = 3;
  string currency = 4;
  string exchange_rate = 5;
  string amount = 6;
  string payment_method = 7;
  string payment_reference = 8;
  string idempotency_key = 9;
  repeated SupplierPaymentAllocation allocations = 10;
}

service PurchasingAdministrationService {
  rpc CreateSupplier(CreateSupplierRequest) returns (Supplier);
  rpc GetSupplier(IDRequest) returns (Supplier);
  rpc ListSuppliers(SupplierListRequest) returns (SupplierListResponse);
  rpc UpdateSupplier(UpdateSupplierRequest) returns (Supplier);
  rpc DeactivateSupplier(IDRequest) returns (Supplier);

  rpc CreatePurchaseNeed(CreatePurchaseNeedRequest) returns (PurchaseNeed);
  rpc GetPurchaseNeed(IDRequest) returns (PurchaseNeed);
  rpc ListPurchaseNeeds(PurchaseNeedListRequest) returns (PurchaseNeedListResponse);
  rpc UpdatePurchaseNeedStatus(StatusRequest) returns (PurchaseNeed);

  rpc CreateSupplierQuote(CreateSupplierQuoteRequest) returns (SupplierQuote);
  rpc GetSupplierQuote(IDRequest) returns (SupplierQuote);
  rpc ListSupplierQuotes(SupplierScopedRequest) returns (SupplierQuoteListResponse);
  rpc UpdateSupplierQuoteStatus(StatusRequest) returns (SupplierQuote);

  rpc CreateSupplierInvoice(CreateSupplierInvoiceRequest) returns (SupplierInvoice);
  rpc GetSupplierInvoice(IDRequest) returns (SupplierInvoice);
  rpc ListSupplierInvoices(SupplierScopedRequest) returns (SupplierInvoiceListResponse);
  rpc IssueSupplierInvoice(IDRequest) returns (SupplierInvoice);
  rpc VoidSupplierInvoice(IDRequest) returns (SupplierInvoice);

  rpc CreateSupplierPayment(CreateSupplierPaymentRequest) returns (SupplierPayment);
  rpc GetSupplierPayment(IDRequest) returns (SupplierPayment);
  rpc ListSupplierPayments(SupplierScopedRequest) returns (SupplierPaymentListResponse);
  rpc PostSupplierPayment(IDRequest) returns (SupplierPayment);
  rpc VoidSupplierPayment(IDRequest) returns (SupplierPayment);
  rpc GetSupplierOutstandingBalance(OutstandingBalanceRequest) returns (SupplierOutstandingBalance);

  rpc GetMonthlyVATPosition(MonthlyVATPositionRequest) returns (MonthlyVATPosition);
}
